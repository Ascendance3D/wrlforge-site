name = "wrlforge-site"
main = "worker.js"
compatibility_date = "2023-10-30"
# Pinned so deploys work with an account-scoped CLOUDFLARE_API_TOKEN
# (avoids the user-level /memberships lookup that 400s for scoped tokens).
account_id = "a3fb626872474ce6d6d3a55829a760e7"

routes = [
  { pattern = "wrlforge.com", custom_domain = true },
  { pattern = "www.wrlforge.com", custom_domain = true }
]

# Self-hosted static assets (house rule: no CDN). Serves the vendored X_ITE
# runtime + hero .wrl for the live scene. Exact-file matches only — everything
# else (including "/") falls through to the Worker, which renders the HTML.
[assets]
directory = "./public"
html_handling = "none"
not_found_handling = "none"
